# actions/configure-pages fills in url and baseurl from the repo; the values
# below are the ones it derives for a user site, spelled out so local preview
# resolves paths exactly as production does.
theme: jekyll-theme-primer
# Both ship with the github-pages bundle the Actions build uses, so listing them
# is all it takes. jekyll-sitemap writes /sitemap.xml and the /robots.txt that
# points at it, covering every page and every published PDF; it skips /404.html
# on its own and anything carrying `sitemap: false` in its front matter.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
title: "Siwon Yun"
# Empty on purpose, and load-bearing. Left unset, jekyll-github-metadata installs
# a lazy fallback that fetches this from the repository over the GitHub API — a
# call made on every build whose answer here is nothing, since the repository has
# no description of its own. It is also a call that can take the build down with
# it: the gem rescues a refused connection but not a 5xx, so a slow minute at
# api.github.com ends the local preview with a Liquid Exception. Naming the value,
# even as "", stops the lookup being installed at all. Replacing "" with a real
# sentence is a content decision — it becomes the search-result snippet and
# og:description — not a build one.
description: ""
url: "https://siwonyun.github.io"
baseurl: ""
# Only what Jekyll would otherwise copy into the build. Dot-directories are not
# on the list because Jekyll already skips every entry whose name starts with a
# dot; `vendor` needs naming precisely because it does not start with one.
exclude:
  - vendor
  - serve-site.sh
  - shrink-images.py
  - Gemfile
  - Gemfile.lock
  - tools-gen-latex-extras.sh
